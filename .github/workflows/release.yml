name: Release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_render:
        description: "Trigger the Render MVP webhook"
        type: boolean
        required: false
        default: false
      deploy_nas:
        description: "Trigger the NAS webhook"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: g0dlog-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/g0dn/g0dlog
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  render-mvp:
    needs: [verify, image]
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_render == true
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Require Render deployment secret
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is required for an automatic release deployment."
            exit 1
          fi
      - name: Trigger disposable Render MVP deployment
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

  nas:
    needs: [verify, image]
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_nas == true
    runs-on: ubuntu-latest
    env:
      NAS_DEPLOY_WEBHOOK_URL: ${{ secrets.NAS_DEPLOY_WEBHOOK_URL }}
      NAS_DEPLOY_WEBHOOK_SECRET: ${{ secrets.NAS_DEPLOY_WEBHOOK_SECRET }}
      IMAGE_NAME: ghcr.io/g0dn/g0dlog
    steps:
      - name: Require NAS deployment secrets
        run: |
          if [ -z "$NAS_DEPLOY_WEBHOOK_URL" ] || [ -z "$NAS_DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::NAS_DEPLOY_WEBHOOK_URL and NAS_DEPLOY_WEBHOOK_SECRET are required for an automatic release deployment."
            exit 1
          fi
      - name: Trigger locked NAS deployment
        run: |
          payload=$(jq -cn --arg ref "$GITHUB_REF_NAME" --arg image "$IMAGE_NAME:$GITHUB_REF_NAME" '{ref:$ref,image:$image}')
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$NAS_DEPLOY_WEBHOOK_SECRET" -binary | od -An -tx1 | tr -d ' \n')
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data "$payload" "$NAS_DEPLOY_WEBHOOK_URL"
